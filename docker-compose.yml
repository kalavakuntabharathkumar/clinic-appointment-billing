services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinicdb
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic_dev_password
    ports:
      - "5432:5432"
    volumes:
      - clinic_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinicdb"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./server
    environment:
      DATABASE_URL: postgresql://clinic:clinic_dev_password@db:5432/clinicdb
      PORT: 5000
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  clinic_data:
